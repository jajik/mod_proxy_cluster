name: CI
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      debug:
        description: "Test logs are generated when on"
        type: choice
        options:
          - "on"
          - "off"
        default: "on"

      code-coverage:
        description: "Test code coverage is gathered when on"
        type: choice
        options:
          - "on"
          - "off"
        default: "on"

      forever-pause:
        description: "Length of a period during which tomcats are run and stopped (MODCLUSTER-736 test)"
        type: number
        default: 100

      iteration-count:
        description: "Number of iterations during which tomcats are started/stopped (Base tests)"
        type: number
        default: 2

      tomcat-cycle-count:
        description: "Number of repetitions of a test cycle (MODCLUSTER-736)"
        type: number
        default: 2

# gcovr reads only the tracefiles written by its own version. Both testsuites gather
# theirs with the gcovr of the httpd image, so the merged-coverage job below, which is
# the only one running outside of it, has to match what test/httpd/Containerfile pins.
env:
  GCOVR_VERSION: "8.6"

jobs:

  cmake-fedora-latest:
    name: cmake-fedora-latest
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            compiler: [ gcc, clang ]
            os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Setup Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Create container and build
        run: |
          {
              echo 'FROM fedora:44'
              echo 'RUN dnf install --assumeyes @c-development cmake httpd-devel ${{ matrix.compiler }}'
              echo 'RUN dnf clean all'
              echo 'COPY mod_proxy_cluster mod_proxy_cluster'
              echo 'WORKDIR /mod_proxy_cluster/native'
              echo 'RUN cmake . -DCMAKE_C_COMPILER=${{ matrix.compiler }}'
              echo 'RUN make'
          } > Containerfile
          podman build .

  make-fedora-latest:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman
      - name: Create container and build
        run: |
          {
              echo 'FROM fedora:44'
              echo 'RUN dnf install --assumeyes @c-development httpd-devel redhat-rpm-config'
              echo 'RUN dnf clean all'
              echo 'COPY mod_proxy_cluster mod_proxy_cluster'
              echo 'WORKDIR /mod_proxy_cluster/native'
              echo 'RUN \'
              echo 'for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager; do \'
              echo '  echo Building: $module; \'
              echo '  cd $module; \'
              echo '  sh buildconf; \'
              echo '  ./configure --with-apxs=$APACHE_DIR/bin/apxs; \'
              echo '  make clean; \'
              # Ensure the build fails in case of a failure in any of the module builds!
              echo '  make || exit 1; \'
              echo '  cd ..; \'
              echo 'done;'
          } > Containerfile
          podman build .

  clang-format-style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check styles
        run: |
          code=0
          cd mod_proxy_cluster/native
          for file in */*.c */*.h; do
            clang-format $file -n &> diff.txt;
            if [ ! -s diff.txt ]; then
              printf "%-42s ... OK\n" $file
            else
              cat diff.txt
              printf "%-42s ... NOK\n" $file
              code=1
            fi
            rm diff.txt || true # we don't fail if the file does not exist
          done;
          exit $code

  clang-tidy-naming-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy apache2-dev
      - name: Check naming conventions
        run: |
          code=0
          cd mod_proxy_cluster/native
          for file in */*.c */*.h; do
            status=0
            output=$(clang-tidy --warnings-as-errors='-*,readability-identifier-naming' "$file" -- -I/usr/include/apache2 -I/usr/include/apr-1.0 -I./include 2>&1) || status=$?
            if [ $status -eq 0 ]; then
              printf "%-42s ... OK\n" "$file"
            else
              echo "$output"
              printf "%-42s ... NOK\n" "$file"
              code=1
            fi
          done
          exit $code

  make-httpd-maintainer-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image-tag: [ "latest", "oldest-supported" ]
    container:
      image: quay.io/mod_cluster/ci-httpd-dev:${{ matrix.image-tag }}
    defaults:
      run:
        shell: bash
    env:
        CFLAGS: "-Wall -Werror"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Print httpd version
        run: echo $HTTPD_VERSION
      - name: Build
        run: |
          cd native
          for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager/; do \
            cd $module; \
            sh buildconf; \
            ./configure --with-apxs=/usr/local/apache2/bin/apxs; \
            make clean; \
            make || exit 1; \
            cd ..; \
          done;

  make-with-httpd-trunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Checkout latest httpd
        uses: actions/checkout@v6
        with:
          repository: apache/httpd
          path: httpd
      - name: Checkout apr for httpd
        uses: actions/checkout@v6
        with:
          repository: apache/apr
          path: httpd/srclib/apr
      - name: Install necessary packages
        run: |
          ls
          sudo apt-get update
          sudo apt-get install gcc cmake make libtool libtool-bin python3 autoconf libxml2-dev libpcre2-dev -y
      - name: Build httpd
        run: |
          ls
          export "APACHE_DIR=/usr/local/apache2/"
          cd httpd
          ./buildconf
          ./configure --prefix=/usr/local/apache2 --with-included-apr --enable-proxy-ajp --enable-maintainer-mode \
                      --enable-so --enable-proxy --enable-proxy-http --enable-proxy-wstunned --enable-proxy-hcheck \
                      --with-port=8090
          sudo make
          sudo make install
      - name: Build mod_proxy_cluster and add it to httpd
        env:
            CFLAGS: "-Wall -Werror"
        run: |
          ls
          cd mod_proxy_cluster/native
          for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager/; do \
            cd $module; \
            sh buildconf; \
            ./configure --with-apxs=/usr/local/apache2/bin/apxs; \
            make clean; \
            make || exit 1; \
            sudo cp *.so /usr/local/apache2/modules; \
            cd ..; \
          done;

  # Both testsuites run against this one image, so that they exercise the very same
  # binaries and the coverage they gather can be merged (see the merged-coverage job).
  build-httpd-image:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
              os: [ ubuntu-latest, ubuntu-24.04-arm ]
    env:
      HTTPD_IMG: local-httpd
      CODE_COVERAGE: ${{ inputs.code-coverage || 'on' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman-docker zstd
          sudo touch /etc/containers/nodocker
      # Compiling httpd takes the better part of the job and depends on the Containerfile
      # alone, so podman's layer cache is carried over between runs. The layers cannot be
      # handed to actions/cache directly, they sit in overlay directories that are readable
      # only inside podman's user namespace; a tarball made in there is what gets cached.
      - name: Restore the podman layer cache
        id: podman-cache
        uses: actions/cache@v4
        with:
          path: /tmp/podman-store.tar.zst
          key: podman-store-${{ matrix.os }}-${{ hashFiles('test/httpd/Containerfile') }}
      - name: Unpack the podman layer cache
        if: steps.podman-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p ~/.local/share/containers
          podman unshare sh -c \
            'zstd -dc /tmp/podman-store.tar.zst | tar -C ~/.local/share/containers -xf -'
      - name: Build the httpd image
        run: |
          cd test
          . includes/common.sh
          httpd_create
          docker save $HTTPD_IMG | zstd -T0 -o /tmp/httpd-image.tar.zst
      # the store has to be packed here, actions/cache only picks the tarball up afterwards
      - name: Pack the podman layer cache
        if: steps.podman-cache.outputs.cache-hit != 'true'
        run: |
          podman unshare tar -C ~/.local/share/containers -cf - storage \
            | zstd -T0 -o /tmp/podman-store.tar.zst
      - name: Preserve the httpd image
        uses: actions/upload-artifact@v6
        with:
          name: httpd-image-${{ matrix.os }}
          path: /tmp/httpd-image.tar.zst
          # the tarball is compressed already, zipping it again buys nothing
          compression-level: 0
          retention-days: 1

  cmake-windows-latest:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            include:
                - os: windows-latest
                  arch: amd64

                - os: windows-11-arm
                  arch: amd64 # we're cross-compiling at this point
    env:
      APACHE_LOUNGE_DISTRO_VERSION: 2.4.68-260617
      HTTPD_DEV_HOME: 'C:\Apache24'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get httpd
        run: |
          curl.exe --output "httpd-apache-lounge.zip" --url "https://www.apachelounge.com/download/VS18/binaries/httpd-${{ env.APACHE_LOUNGE_DISTRO_VERSION }}-win64-VS18.zip"
          Expand-Archive -Path "httpd-apache-lounge.zip" -DestinationPath "C:\"
      - name: Build
        run: |
          & (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\" -Filter "Launch-VsDevShell.ps1" -Recurse).FullName -Arch ${{ matrix.arch }} -SkipAutomaticLocation
          ./native/scripts/windows-build.bat
          cp cmakebuild/modules/*.so C:/Apache24/modules/
      - name: Fix and prepare config files
        run: |
          cp test\httpd\mod_proxy_cluster.conf ${{ env.HTTPD_DEV_HOME }}\conf\mod_proxy_cluster.conf
          echo "LogLevel debug"                      >> ${{ env.HTTPD_DEV_HOME }}\conf\mod_proxy_cluster.conf
          echo "Include conf/mod_proxy_cluster.conf" >> ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
          (Get-Content ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf) | %{$_ -replace "Listen 80","#Listen 80"} | Set-Content -Path ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
          (Get-Content ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf) | %{$_ -replace "Apache24-64","Apache24"} | Set-Content -Path ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
      - name: Run
        run: |
          Start-Process -FilePath ${{ env.HTTPD_DEV_HOME }}\bin\httpd.exe
          curl --fail --max-time 10 http://localhost:8090
          curl --fail --max-time 10 http://localhost:8090/mod_cluster_manager
      - name: Preserve logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Windows logs for ${{ matrix.os }}
          path: C:\Apache24\logs\
          retention-days: 7

  tests:
    runs-on: ${{ matrix.os }}
    needs: build-httpd-image
    strategy:
        fail-fast: false
        matrix:
              os: [ ubuntu-latest, ubuntu-24.04-arm ]
    env:
      IMG: local-tomcat
      HTTPD_IMG: local-httpd
      HTTPD_IMG_PREBUILT: "on"
      DEBUG: ${{ inputs.debug || 'on' }}
      FOREVER_PAUSE: ${{ inputs.forever-pause || 100 }}
      ITERATION_COUNT: ${{ inputs.iteration-count || 2 }}
      TOMCAT_CYCLE_COUNT: ${{ inputs.tomcat-cycle-count || 2 }}
      CODE_COVERAGE: ${{ inputs.code-coverage || 'on' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman-docker maven git curl iproute2 wcstools zstd
          sudo touch /etc/containers/nodocker
          cd test
          sh setup-dependencies.sh
      - name: Configure Podman logging driver
        run: |
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/containers.conf
          [containers]
          log_driver = "k8s-file"

          [engine]
          events_logger = "file"
          EOF
      - name: Get the httpd image built in the previous job
        uses: actions/download-artifact@v7
        with:
          name: httpd-image-${{ matrix.os }}
          path: /tmp
      - name: Load the httpd image
        run: zstd -dc /tmp/httpd-image.tar.zst | docker load
      - name: Run testsuite
        run: |
          cd test
          sh testsuite.sh
      - name: Preserve test logs
        uses: actions/upload-artifact@v6
        if: ${{ env.DEBUG == 'on' }}
        with:
          name: Test logs ${{ matrix.os }}
          path: |
            test/logs/*
          retention-days: 7
      - name: Print the coverage summary
        if: ${{ env.CODE_COVERAGE == 'on' }}
        run: cat test/coverage/test-coverage.txt
      # Preserve coverage data if defined
      - name: Preserve coverage files
        if: ${{ env.CODE_COVERAGE == 'on' }}
        uses: actions/upload-artifact@v6
        with:
            name: Coverage ${{ matrix.os }}
            path: test/coverage/*
            retention-days: 7

  # The Apache::Test testsuite is run on top of the image the container testsuite uses,
  # see test-perl/Containerfile for why.
  perl-tests:
    runs-on: ubuntu-latest
    needs: build-httpd-image
    env:
      HTTPD_IMG: local-httpd
      PERL_IMG: local-perl-tests
      CODE_COVERAGE: ${{ inputs.code-coverage || 'on' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman-docker zstd
          sudo touch /etc/containers/nodocker
      - name: Get the httpd image built in the previous job
        uses: actions/download-artifact@v7
        with:
          name: httpd-image-ubuntu-latest
          path: /tmp
      - name: Load the httpd image
        run: zstd -dc /tmp/httpd-image.tar.zst | docker load
      - name: Build the perl testsuite image
        run: docker build -t $PERL_IMG --build-arg HTTPD_IMG=$HTTPD_IMG -f test-perl/Containerfile test-perl/
      - name: Run testsuite
        run: |
          if [ "$CODE_COVERAGE" = "on" ]; then coverage_env="-e ENABLE_COVERAGE=1"; fi
          docker run --name perl-tests $coverage_env $PERL_IMG
      # the container is kept around by the step above precisely for this
      - name: Get the logs and the coverage out of the container
        if: always()
        run: |
          mkdir -p test-perl/t/logs test-perl/coverage
          docker cp perl-tests:/test-perl/t/logs/. test-perl/t/logs/ || true
          docker cp perl-tests:/coverage/. test-perl/coverage/ || true
      - name: Preserve test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Perl tests logs
          path: |
            test-perl/t/logs/*
          retention-days: 7
      - name: Print the coverage summary
        if: ${{ env.CODE_COVERAGE == 'on' }}
        run: cat test-perl/coverage/test-coverage.txt
      - name: Preserve coverage files
        if: ${{ env.CODE_COVERAGE == 'on' }}
        uses: actions/upload-artifact@v6
        with:
          name: Perl tests coverage
          path: test-perl/coverage/*
          retention-days: 7

  # Merges what both testsuites gathered into a single report. That works because both
  # of them run the modules of one and the same image; coverage of differently built
  # ones does not merge, it piles up side by side instead.
  merged-coverage:
    runs-on: ubuntu-latest
    needs: [ tests, perl-tests ]
    if: ${{ inputs.code-coverage != 'off' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov python3-pip
          sudo pip install --break-system-packages gcovr==$GCOVR_VERSION
      # Only the x86 run is taken. It goes through the very same tests as the arm one,
      # which is built by a different gcc and would therefore not merge but pile up.
      - name: Get the coverage gathered by the container testsuite
        uses: actions/download-artifact@v7
        with:
          name: Coverage ubuntu-latest
          path: coverage
      - name: Get the coverage gathered by the perl testsuite
        uses: actions/download-artifact@v7
        with:
          name: Perl tests coverage
          path: coverage
      # the per-suite reports are dropped, only the tracefiles are of interest here
      - name: Merge the tracefiles
        run: |
          rm -rf coverage/lcov coverage/test-coverage.*
          native/scripts/coverage.sh report coverage
      - name: Print the coverage summary
        run: cat coverage/test-coverage.txt
      - name: Preserve coverage files
        uses: actions/upload-artifact@v6
        with:
          name: Merged coverage
          path: coverage/*
          retention-days: 7

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Build doxygen docs
        run: doxygen
      - name: Preserve doxygen docs
        uses: actions/upload-artifact@v6
        with:
          name: Doxygen docs
          path: doxygen-out/html/*
          retention-days: 30
